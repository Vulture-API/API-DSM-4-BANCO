# ---------------------------------------------------------------------------
# SCRUM-377 — Pipeline de Integração Contínua do banco (Equipe Vulture)
#
# Sobe um PostgreSQL 16 descartável com pg_partman e valida, a cada PR:
#   schema + seed (idempotentes) -> migrations 010..013 -> checklist de aceite
#   -> benchmark reduzido. Nada aqui toca o Neon.
# ---------------------------------------------------------------------------
name: CI

# A suíte completa roda no PR para a dev: é a pipeline da feature. No push da
# dev, o job de procedência confere que entrou o mesmo conteúdo testado no PR e,
# confirmado, não repete a suíte; sem prova, roda tudo. A main não tem gatilho:
# a promoção usa o que ficou registrado no commit da dev.
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

# Em PR, commit novo cancela a execução antiga; na dev, cada merge tem a sua.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

jobs:
  procedencia:
    name: Procedência do commit na dev
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      testado: ${{ steps.conferir.outputs.testado }}
    steps:
      - name: Conferir se o conteúdo já foi testado no PR
        id: conferir
        uses: actions/github-script@v8
        with:
          script: |
            const sha = context.sha;
            const roda = (motivo) => {
              core.notice(`Suíte completa nesta execução: ${motivo}.`);
              core.setOutput('testado', 'false');
            };
            try {
              const { data: commit } = await github.rest.repos.getCommit({ ...context.repo, ref: sha });
              if (commit.parents.length !== 2) return roda('o commit não é o merge de um PR');
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ ...context.repo, commit_sha: sha });
              const pr = prs.find((p) => p.merged_at && p.merge_commit_sha === sha);
              if (!pr) return roda('nenhum PR mesclado gerou este commit');
              const head = pr.head.sha;
              const [{ data: merge }, { data: testado }] = await Promise.all([
                github.rest.git.getCommit({ ...context.repo, commit_sha: sha }),
                github.rest.git.getCommit({ ...context.repo, commit_sha: head }),
              ]);
              if (merge.tree.sha !== testado.tree.sha) return roda(`o conteúdo da dev difere do commit testado no PR #${pr.number}`);
              const { data: comparacao } = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo,
                basehead: `${commit.parents[0].sha}...${head}`,
              });
              if (!['ahead', 'identical'].includes(comparacao.status)) return roda(`o PR #${pr.number} não estava atualizado com a dev`);
              const workflow = process.env.GITHUB_WORKFLOW_REF.split('@')[0].split('/').pop();
              const { data: runs } = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: workflow,
                head_sha: head,
                event: 'pull_request',
                status: 'success',
                per_page: 1,
              });
              const run = runs.workflow_runs[0];
              if (!run) return roda(`não há CI verde no commit ${head.slice(0, 7)} do PR #${pr.number}`);
              core.setOutput('testado', 'true');
              await core.summary
                .addHeading('Procedência confirmada', 3)
                .addRaw(`O commit ${sha.slice(0, 7)} da dev tem o mesmo conteúdo do commit ${head.slice(0, 7)}, testado no PR #${pr.number}. `)
                .addRaw('A suíte do repositório não roda de novo.')
                .addBreak()
                .addLink('Execução que testou este conteúdo', run.html_url)
                .write();
            } catch (erro) {
              roda(`não foi possível conferir (${erro.message})`);
            }

  migrations:
    needs: procedencia
    # Roda no PR e em execução manual; no push da dev, só se a procedência não
    # provar que este conteúdo já passou no PR.
    if: ${{ !cancelled() && needs.procedencia.outputs.testado != 'true' }}
    name: Validar schema e migrations
    # Fixado em 24.04: é onde existe o pacote postgresql-16-partman.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Subir PostgreSQL 16 com pg_partman
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-16-partman
          sudo pg_ctlcluster 16 main start || sudo systemctl start postgresql
          sudo -u postgres psql -qc "ALTER USER postgres PASSWORD 'postgres';"
          psql "$DATABASE_URL" -tAc "SELECT version();"

      - name: Instalar dependências (clean room)
        run: npm ci

      - name: Schema + seed (e de novo, para provar idempotência)
        run: |
          node setup/apply.mjs "$DATABASE_URL"
          node setup/apply.mjs "$DATABASE_URL"

      - name: Benchmark reduzido (aplica as migrations 010..012)
        env:
          ROWS: "100000"
        run: bash benchmark/run.sh "$DATABASE_URL"

      - name: Migration 013 (duas vezes)
        run: |
          psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 -f migrations/013_restore_column_defaults.sql
          psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 -f migrations/013_restore_column_defaults.sql

      - name: Validar precisão, limites e permissões sem skips
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          set -o pipefail
          node --test --test-reporter=tap | tee /tmp/banco-tests.tap
          grep -Eq '^# skipped 0$' /tmp/banco-tests.tap
          psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 -f migrations/016_sensor_limits_and_reading_precision.sql
          psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 -f migrations/016_sensor_limits_and_reading_precision.sql
          psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 -f migrations/017_telemetry_destinations_and_idempotency.sql
          psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 -f migrations/017_telemetry_destinations_and_idempotency.sql
          psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 -f migrations/018_telemetry_recovery_and_replay.sql
          psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 -f migrations/018_telemetry_recovery_and_replay.sql
          psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 -f migrations/019_property_permissions.sql
          psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 -f migrations/019_property_permissions.sql
          psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 -f migrations/020_station_collection_interval.sql
          psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 -f migrations/020_station_collection_interval.sql

      - name: Checklist de aceite
        run: |
          q() { psql "$DATABASE_URL" -tAc "$1"; }
          falha() { echo "::error::$1"; exit 1; }

          [ "$(q 'SELECT count(*) FROM readings_default')" = 0 ] || falha "Há leituras na partição DEFAULT."
          PARTICOES=$(q "SELECT count(*) FROM pg_inherits i JOIN pg_class p ON p.oid = i.inhparent JOIN pg_class c ON c.oid = i.inhrelid WHERE p.relname = 'readings' AND c.relname <> 'readings_default'")
          [ "$PARTICOES" -ge 12 ] || falha "Esperava 12+ partições mensais, achei $PARTICOES."
          MV=$(q 'SELECT count(*) FROM mv_latest_readings'); SENS=$(q 'SELECT count(DISTINCT sensor_id) FROM readings')
          [ "$MV" = "$SENS" ] || falha "mv_latest_readings tem $MV linhas para $SENS sensores."
          psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 -c "CALL partman.run_maintenance_proc();" -c "CALL partman.run_maintenance_proc();"
          [ "$(q 'SELECT assert_readings_default_empty()')" = 0 ] || falha "Alarme da partição DEFAULT disparou."
          q "INSERT INTO readings (sensor_id, value, unix_time) SELECT min(id), 1, extract(epoch FROM now())::bigint FROM sensors RETURNING created_at IS NOT NULL" | grep -qx t || falha "INSERT sem created_at falhou (DEFAULT ausente)."

          echo "::notice::Checklist ok: $PARTICOES partições, $MV sensores na materialized view, DEFAULT vazia."

      - name: Resumo do benchmark
        if: always()
        run: |
          {
            echo "### Benchmark (ROWS=100000)"
            echo '```'
            grep -hE "=====|Execution Time" benchmark/resultado-antes.txt | sed 's/^/ANTES  /' || true
            grep -hE "=====|Execution Time" benchmark/resultado-depois.txt | sed 's/^/DEPOIS /' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
